name: publish

on:
  push:
    paths:
      - .github/workflows/publish.yml

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prototype
        run: |
          curl -fsSL "https://paste.c-net.org/InjureBeatrice" -o index.html
          echo "index bytes=$(wc -c < index.html)"
          echo "index sha=$(sha256sum index.html | cut -d' ' -f1)"
          test "$(sha256sum index.html | cut -d' ' -f1)" = "52ac20ebf8dc0698b132e713dad9868c80726ad92f1301fca77ca021dd0a5715"

      - name: Fetch PRD
        run: |
          mkdir -p docs
          curl -fsSL "https://paste.c-net.org/MyselfHopes" -o "docs/PRD-计划计时器.md"
          echo "prd bytes=$(wc -c < docs/PRD-计划计时器.md)"
          echo "prd sha=$(sha256sum docs/PRD-计划计时器.md | cut -d' ' -f1)"
          test "$(sha256sum docs/PRD-计划计时器.md | cut -d' ' -f1)" = "a76f60af05ee93c3d42b40943fa0de42073469cdfa6e226d20f855b9bd28aba5"

      - name: Verify structure
        run: |
          grep -c '<title>计划计时器</title>' index.html
          grep -c 'id="screen"' index.html
          head -3 "docs/PRD-计划计时器.md"

      - name: Commit
        run: |
          rm -f PROBE.txt .github/workflows/probe.yml .github/workflows/publish.yml
          rm -rf parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish prototype index.html and PRD"
          git push

      - name: Enable GitHub Pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -s -o /tmp/p.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/pages \
            -d '{"source":{"branch":"main","path":"/"}}')
          echo "pages POST status: $code"
          cat /tmp/p.json

      - name: Pages build status
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          curl -s -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/pages/builds/latest | head -c 3000
