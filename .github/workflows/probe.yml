name: probe

on:
  push:
    paths:
      - .github/workflows/probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report
        run: |
          echo "probe ok"
          sha256sum README.md
          ls -la
      - name: Try write
        run: |
          echo "write-ok" > PROBE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROBE.txt
          git commit -m "test: probe write permission"
          git push
