name: pages-enable

on:
  push:
    paths:
      - .github/workflows/pages-enable.yml

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Try enable Pages (legacy build)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -s -o /tmp/a.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/pages \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
          echo "legacy POST: $code" >> pages-status.txt
          head -c 300 /tmp/a.json >> pages-status.txt
          echo "" >> pages-status.txt

      - name: Try enable Pages (actions build)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -s -o /tmp/b.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/pages \
            -d '{"build_type":"workflow"}')
          echo "workflow POST: $code" >> pages-status.txt
          head -c 300 /tmp/b.json >> pages-status.txt
          echo "" >> pages-status.txt

      - name: Read Pages config
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -s -o /tmp/c.json -w "%{http_code}" -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" https://api.github.com/repos/$REPO/pages)
          echo "GET pages: $code" >> pages-status.txt
          head -c 400 /tmp/c.json >> pages-status.txt
          echo "" >> pages-status.txt

      - name: Save status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-status.txt
          git commit -m "chore: record pages api status" || echo "no change"
          git push
